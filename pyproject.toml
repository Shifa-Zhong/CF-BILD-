[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-bild-dd"
version = "0.2.0"
description = "Reproducible CF-BILD workflow for DD-ART-06-2026-000373"
requires-python = "==3.10.*"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "torch==2.10.0",
  "gpytorch==1.15.2",
  "botorch==0.16.1",
  "hyperopt==0.2.7",
  "rdkit-pypi==2022.9.5",
]

[tool.setuptools]
packages = ["cf_bild"]

